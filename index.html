<style type="text/tailwindcss">
  :root { color-scheme: dark; }
  html, body { @apply h-full; }
  body { @apply bg-[#07090E] text-slate-200 font-sans antialiased; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  .card { @apply bg-[#111520]/80 backdrop-blur-xl border border-white/[0.08] hover:border-white/[0.15] rounded-2xl shadow-2xl transition-all duration-300; }
  .card-static { @apply bg-[#111520]/80 backdrop-blur-xl border border-white/[0.08] rounded-2xl shadow-2xl; }

  .text-gradient {
    background: linear-gradient(135deg, #818cf8, #c084fc 60%, #f0abfc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .glow-border {
    position: relative;
  }
  .glow-border::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 1rem;
    padding: 1px;
    background: linear-gradient(120deg, rgba(99,102,241,0.6), rgba(168,85,247,0.3), rgba(56,189,248,0.5));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .pill { @apply w-9 h-9 flex items-center justify-center rounded-lg text-[11px] font-mono font-semibold transition-all duration-150 select-none; }
  .pill-cleared { @apply bg-emerald-500/20 text-emerald-300 border border-emerald-500/40; }
  .pill-pending { @apply bg-white/5 text-slate-500 border border-white/10 hover:bg-white/10 hover:text-slate-300; }
  .pill-next { @apply bg-indigo-500/10 text-indigo-200 border-2 border-indigo-400/70; animation: pulseRing 1.8s ease-in-out infinite; }
  @keyframes pulseRing {
    0%, 100% { box-shadow: 0 0 0 0 rgba(129,140,248,0.45); }
    50% { box-shadow: 0 0 0 5px rgba(129,140,248,0); }
  }

  .mode-btn { @apply flex-1 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 transition-all duration-150 text-center; }
  .mode-btn-active { @apply text-white shadow-lg; background: linear-gradient(135deg, #6366f1, #a855f7); box-shadow: 0 6px 20px -6px rgba(99,102,241,0.55); }

  .btn-primary { @apply px-4 py-2.5 rounded-lg text-sm font-semibold text-white transition-all duration-150; background: linear-gradient(135deg, #6366f1, #a855f7); }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { filter: brightness(0.95); }

  .btn-ghost { @apply px-3 py-2 rounded-lg text-sm font-medium text-slate-300 border border-white/10 bg-white/[0.03] transition-all duration-150 hover:bg-white/[0.08]; }
  .btn-danger-ghost { @apply px-3 py-2 rounded-lg text-sm font-medium text-rose-400 border border-rose-500/20 bg-rose-500/[0.04] transition-all duration-150 hover:bg-rose-500/10; }

  .field-label { @apply block text-xs font-medium text-slate-400 mb-1.5; }
  .field-input { @apply w-full rounded-lg bg-white/[0.04] border border-white/10 px-3 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 outline-none transition-colors duration-150; }
  .field-input:focus { @apply border-indigo-400/50 bg-white/[0.06]; }

  .tab-btn { @apply px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 transition-colors duration-150 whitespace-nowrap flex items-center gap-1.5; }
  .tab-btn-active { @apply bg-white/10 text-slate-100; }

  .badge { @apply text-[10px] font-semibold px-2 py-0.5 rounded-md tracking-wide font-mono; }

  .toast { @apply card-static px-4 py-3 rounded-xl text-sm text-slate-100 shadow-2xl flex items-center gap-2.5; animation: toast-in 0.28s cubic-bezier(0.16,1,0.3,1); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

  @keyframes ring-in { from { stroke-dashoffset: var(--ring-full); } to { stroke-dashoffset: var(--ring-offset); } }
  .ring-progress { animation: ring-in 1.1s cubic-bezier(0.16,1,0.3,1) forwards; }

  @keyframes modal-in { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal-in { animation: modal-in 0.2s cubic-bezier(0.16,1,0.3,1); }

  input[type="range"] { accent-color: #a855f7; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;

<script>
/* =========================================================
   Constants
========================================================= */
const STORAGE_KEY = 'jee_command_center_v1';

const SUBJECTS = {
  physics: { label: 'Physics',        short: 'Physics',  badge: 'bg-sky-500/15 text-sky-300 border border-sky-400/25',       barFrom: 'from-sky-400',     barTo: 'to-sky-600',     tabActive: 'bg-sky-500/15 text-sky-300',       dot: 'bg-sky-400' },
  pchem:   { label: 'Physical Chem',  short: 'P. Chem',  badge: 'bg-orange-500/15 text-orange-300 border border-orange-400/25', barFrom: 'from-orange-400',  barTo: 'to-orange-600',  tabActive: 'bg-orange-500/15 text-orange-300', dot: 'bg-orange-400' },
  ichem:   { label: 'Inorganic Chem', short: 'I. Chem',  badge: 'bg-emerald-500/15 text-emerald-300 border border-emerald-400/25', barFrom: 'from-emerald-400', barTo: 'to-emerald-600', tabActive: 'bg-emerald-500/15 text-emerald-300', dot: 'bg-emerald-400' },
  ochem:   { label: 'Organic Chem',   short: 'O. Chem',  badge: 'bg-rose-500/15 text-rose-300 border border-rose-400/25',     barFrom: 'from-rose-400',    barTo: 'to-rose-600',    tabActive: 'bg-rose-500/15 text-rose-300',     dot: 'bg-rose-400' },
  maths:   { label: 'Mathematics',    short: 'Maths',    badge: 'bg-violet-500/15 text-violet-300 border border-violet-400/25', barFrom: 'from-violet-400', barTo: 'to-violet-600',  tabActive: 'bg-violet-500/15 text-violet-300', dot: 'bg-violet-400' },
};
const SUBJECT_ORDER = ['physics', 'pchem', 'ichem', 'ochem', 'maths'];
const CONFETTI_COLORS = ['#38bdf8', '#fb923c', '#34d399', '#fb7185', '#a78bfa'];

/* =========================================================
   Default data
========================================================= */
function range(a, b) { const out = []; for (let i = a; i <= b; i++) out.push(i); return out; }
function mkChapter(subject, name, total, cleared, isOngoing) {
  return { id: uid(), subject, name, totalLectures: total, clearedLectures: [...cleared], isOngoing: !!isOngoing };
}

function defaultState() {
  return {
    chapters: [
      mkChapter('physics', 'Motion in a Plane', 17, [1,2,3,4,5,6,7,8,9], false),
      mkChapter('physics', 'Laws of Motion', 21, [1,2], false),
      mkChapter('physics', 'Circular Motion', 8, [], false),
      mkChapter('physics', 'Work, Energy and Power', 8, [], true),
      mkChapter('pchem', 'States of Matter', 5, [1,2], false),
      mkChapter('pchem', 'Thermodynamics', 8, [], true),
      mkChapter('ichem', 'Chemical Bonding', 26, [1,2,3,4,5,6,7], false),
      mkChapter('maths', 'Set Theory (CH-01)', 8, range(1,8), false),
      mkChapter('maths', 'Basic Mathematics (CH-02)', 21, range(1,21), false),
      mkChapter('maths', 'Quadratic Equations (CH-03)', 14, range(1,14), false),
      mkChapter('maths', 'Sequence and Series (CH-04)', 12, [1,2,3], false),
      mkChapter('maths', 'Trigonometric Functions (CH-05)', 13, [], false),
      mkChapter('maths', 'Trigonometric Equation (CH-06)', 7, [], false),
      mkChapter('maths', 'Relations and Functions (CH-07)', 5, [], false),
      mkChapter('maths', 'Permutations and Combinations (CH-08)', 11, [], false),
      mkChapter('maths', 'Binomial Theorem (CH-09)', 4, [], true),
    ],
    settings: { scenario: 'parallel', weekdayPace: 2, sundayPace: 4, holidaysUpcoming: 0 },
    logsByDate: {},
    additionsByDate: {},
    ui: { filter: 'all' },
  };
}

/* =========================================================
   Persistence
========================================================= */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    if (!Array.isArray(parsed.chapters)) return base;
    return {
      chapters: parsed.chapters,
      settings: { ...base.settings, ...(parsed.settings || {}) },
      logsByDate: parsed.logsByDate || {},
      additionsByDate: parsed.additionsByDate || {},
      ui: { ...base.ui, ...(parsed.ui || {}) },
    };
  } catch (e) {
    console.error('Could not read saved data, starting fresh.', e);
    return defaultState();
  }
}

let state = loadState();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('Could not save data.', e);
    showToast('Could not save — browser storage may be full.', 'error');
  }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* =========================================================
   Date helpers
========================================================= */
function todayStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function formatLongDate(date) { return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
function formatWeekday(date) { return date.toLocaleDateString('en-IN', { weekday: 'long' }); }
function prefersReducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

/* =========================================================
   Chapter math
========================================================= */
function pendingCount(ch) { return ch.totalLectures - ch.clearedLectures.length; }
function nextPendingNumber(ch) {
  for (let i = 1; i <= ch.totalLectures; i++) if (!ch.clearedLectures.includes(i)) return i;
  return null;
}
function totalPendingAll() { return state.chapters.reduce((s, c) => s + pendingCount(c), 0); }
function totalClearedAll() { return state.chapters.reduce((s, c) => s + c.clearedLectures.length, 0); }
function pendingBySubject(subjectKey) {
  return state.chapters.filter(c => c.subject === subjectKey).reduce((s, c) => s + pendingCount(c), 0);
}
function chaptersOf(subjectKey) { return state.chapters.filter(c => c.subject === subjectKey); }

/* =========================================================
   Live-sync simulation
========================================================= */
function isOffDay(date, budget) {
  if (date.getDay() === 0) return true;
  if (budget.remaining > 0) { budget.remaining -= 1; return true; }
  return false;
}
function simulateClear({ scenario, weekdayPace, sundayPace, holidaysUpcoming, backlogStart }) {
  if (backlogStart <= 0) return { achievable: true, days: 0, date: new Date() };
  if (weekdayPace <= 0 && sundayPace <= 0) return { achievable: false, days: null, date: null };

  const today = new Date();
  const budget = { remaining: holidaysUpcoming };
  let backlog = backlogStart;
  const MAX_DAYS = 3650;

  for (let i = 1; i <= MAX_DAYS; i++) {
    const cursor = addDays(today, i);
    const off = isOffDay(cursor, budget);
    if (scenario === 'parallel') {
      backlog -= off ? sundayPace : weekdayPace;
    } else {
      const added = off ? 0 : 2;
      backlog += added - (off ? sundayPace : weekdayPace);
    }
    if (backlog <= 0) return { achievable: true, days: i, date: cursor };
  }
  return { achievable: false, days: null, date: null };
}

/* =========================================================
   Chapter mutations
========================================================= */
function clearLecture(chapterId, lectureNum, { log = true, confettiBurst = false } = {}) {
  const ch = state.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  if (ch.clearedLectures.includes(lectureNum)) return;
  ch.clearedLectures.push(lectureNum);
  if (log) {
    const entry = { id: uid(), chapterId: ch.id, chapterName: ch.name, subject: ch.subject, lectureNum, time: Date.now() };
    const key = todayStr();
    state.logsByDate[key] = state.logsByDate[key] || [];
    state.logsByDate[key].push(entry);
  }
  saveState();
  render();
  if (confettiBurst) fireConfetti();
}
function unclearLecture(chapterId, lectureNum) {
  const ch = state.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  ch.clearedLectures = ch.clearedLectures.filter(n => n !== lectureNum);
  const key = todayStr();
  if (state.logsByDate[key]) {
    state.logsByDate[key] = state.logsByDate[key].filter(e => !(e.chapterId === chapterId && e.lectureNum === lectureNum));
  }
  saveState();
  render();
}
function toggleLecturePill(chapterId, lectureNum) {
  const ch = state.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  if (ch.clearedLectures.includes(lectureNum)) {
    unclearLecture(chapterId, lectureNum);
  } else {
    clearLecture(chapterId, lectureNum, { log: true, confettiBurst: false });
    showToast(`Logged L${lectureNum} · ${ch.name}`);
  }
}
function clearNextForChapter(chapterId) {
  const ch = state.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  const next = nextPendingNumber(ch);
  if (next === null) { showToast('This chapter is already fully cleared', 'info'); return; }
  clearLecture(chapterId, next, { log: true, confettiBurst: false });
  showToast(`Logged L${next} · ${ch.name}`);
}
function addLecturesToChapter(chapterId, count) {
  const ch = state.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  ch.totalLectures += count;
  const key = todayStr();
  state.additionsByDate[key] = state.additionsByDate[key] || [];
  state.additionsByDate[key].push({ id: uid(), type: 'lectures', chapterId: ch.id, chapterName: ch.name, count });
  saveState();
  render();
  showToast(`+${count} added to ${ch.name}`);
}
function logHolidayToday() {
  const key = todayStr();
  state.additionsByDate[key] = state.additionsByDate[key] || [];
  state.additionsByDate[key].push({ id: uid(), type: 'holiday' });
  saveState();
  render();
  showToast('Marked today as a holiday — 0 new classes');
}
function deleteChapter(chapterId) {
  const ch = state.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  if (!confirm(`Delete "${ch.name}" and all its lectures? This can't be undone.`)) return;
  state.chapters = state.chapters.filter(c => c.id !== chapterId);
  saveState();
  render();
}

/* =========================================================
   Confetti
========================================================= */
function fireConfetti() {
  if (prefersReducedMotion()) return;
  if (typeof confetti !== 'function') return;
  try {
    confetti({ particleCount: 55, spread: 65, startVelocity: 35, origin: { y: 0.35 }, colors: CONFETTI_COLORS, scalar: 0.9 });
  } catch (e) { console.error('Confetti failed', e); }
}

/* =========================================================
   Toasts
========================================================= */
function showToast(message, kind = 'success') {
  const container = document.getElementById('toast-container');
  const icon = kind === 'error' ? 'alert-circle' : kind === 'info' ? 'info' : 'check-circle-2';
  const color = kind === 'error' ? 'text-rose-400' : kind === 'info' ? 'text-indigo-300' : 'text-emerald-400';
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 ${color} shrink-0"></i><span>${escapeHtml(message)}</span>`;
  container.appendChild(el);
  lucide.createIcons();
  setTimeout(() => {
    el.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 260);
  }, 2800);
}
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

/* =========================================================
   Render: Hero Action Bar (Feature 1)
========================================================= */
function renderHeroBar() {
  const el = document.getElementById('hero-action-bar');
  const subjectsWithPending = SUBJECT_ORDER.filter(k => pendingBySubject(k) > 0);

  if (subjectsWithPending.length === 0) {
    el.innerHTML = `
      <div class="flex items-center gap-3">
        <i data-lucide="party-popper" class="w-6 h-6 text-emerald-400 shrink-0"></i>
        <div>
          <p class="font-sans font-bold text-slate-100">Every lecture is cleared!</p>

function populateWatchChapterOptions() {
  const subjSel = document.getElementById('watch-subject');
  const chapSel = document.getElementById('watch-chapter');
  if (!subjSel || !chapSel) return;
  const chapters = chaptersOf(subjSel.value).filter(c => pendingCount(c) > 0);
  chapSel.innerHTML = chapters.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}
function populateWatchLectureOptions() {
  const chapSel = document.getElementById('watch-chapter');
  const lecSel = document.getElementById('watch-lecture');
  if (!chapSel || !lecSel) return;
  const ch = state.chapters.find(c => c.id === chapSel.value);
  if (!ch) { lecSel.innerHTML = ''; return; }
  const pendingNums = [];
  for (let i = 1; i <= ch.totalLectures; i++) if (!ch.clearedLectures.includes(i)) pendingNums.push(i);
  lecSel.innerHTML = pendingNums.map(n => `<option value="${n}">L${n}</option>`).join('');
}

function renderChapterCard(ch) {
  const total = ch.totalLectures;
  const clearedCount = ch.clearedLectures.length;

  const isComplete = total > 0 && clearedCount === total;
  const next = nextPendingNumber(ch);
  const subj = SUBJECTS[ch.subject];

  const pills = [];
  for (let i = 1; i <= total; i++) {
    const isCleared = ch.clearedLectures.includes(i);
    const isNext = !isCleared && i === next;
    const cls = isCleared ? 'pill pill-cleared' : isNext ? 'pill pill-next' : 'pill pill-pending';
    pills.push(`
      <button type="button" data-action="toggle-pill" data-chapter="${ch.id}" data-lecture="${i}"
        class="${cls}" title="Lecture ${i}${isCleared ? ' · cleared' : isNext ? ' · next up' : ''}">
        ${isCleared ? '<i data-lucide=\'check\' class=\'w-3.5 h-3.5\'></i>' : i}
      </button>`);
  }

  return `
    <div class="card p-5 ${isComplete ? 'border-emerald-400/30' : ''}">
      <div class="flex items-start justify-between gap-3 mb-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2 mb-1.5 flex-wrap">

            ${isComplete
              ? `<span class="badge bg-emerald-500/15 text-emerald-300">Cleared ✅</span>`
              : `<span class="badge bg-white/5 text-slate-400">${pendingCount(ch)} Pending</span>`}
          </div>
          <h3 class="font-sans font-bold text-slate-100 truncate">${escapeHtml(ch.name)}</h3>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button type="button" data-action="edit-chapter" data-chapter="${ch.id}" class="text-slate-600 hover:text-indigo-300 transition-colors duration-150" title="Edit chapter">
            <i data-lucide="pencil" class="w-4 h-4"></i>
          </button>
          <button type="button" data-action="delete-chapter" data-chapter="${ch.id}" class="text-slate-600 hover:text-rose-400 transition-colors duration-150" title="Delete chapter">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center gap-3 mb-3.5">
        <div class="flex-1 h-1.5 rounded-full bg-white/5 overflow-hidden">
          <div class="h-full rounded-full bg-gradient-to-r ${subj.barFrom} ${subj.barTo} transition-all duration-500" style="width:${pct}%;"></div>
        </div>
        <span class="text-xs text-slate-500 font-mono shrink-0">${clearedCount}/${total} (${pct}%)</span>

      ${total > 0 ? `<div class="flex flex-wrap gap-1.5 mb-4">${pills.join('')}</div>` : `<p class="text-xs text-slate-600 mb-4">No lectures yet.</p>`}

      <div class="flex items-center gap-2 flex-wrap">
        <button type="button" data-action="clear-next" data-chapter="${ch.id}" class="btn-ghost text-xs" ${isComplete ? 'disabled' : ''}>
          <i data-lucide="check" class="w-3.5 h-3.5"></i> Mark Next Done

      </div>
    </div>
  `;

/* =========================================================
   Chapter modal (add / edit)
========================================================= */
let chapterModalMode = 'add';
let chapterModalEditId = null;
let adderPrefill = null; // { total, ongoing } set when opened from daily adder "+ New chapter"

function openChapterModal({ mode, chapterId = null, prefillSubject = null }) {
  chapterModalMode = mode;
  chapterModalEditId = chapterId;
  document.getElementById('chapter-modal-error').classList.add('hidden');

  if (mode === 'edit') {
    const ch = state.chapters.find(c => c.id === chapterId);
    if (!ch) return;
    document.getElementById('chapter-modal-title').textContent = 'Edit Chapter';
    document.getElementById('cm-total-label').textContent = 'Total lectures';
    document.getElementById('cm-subject').value = ch.subject;
    document.getElementById('cm-name').value = ch.name;
    document.getElementById('cm-total').value = ch.totalLectures;
    document.getElementById('cm-ongoing').checked = ch.isOngoing;
    document.getElementById('save-chapter-btn').textContent = 'Save Changes';
  } else {
    document.getElementById('chapter-modal-title').textContent = 'Add New Chapter';
    document.getElementById('cm-total-label').textContent = 'Pending lectures';
    document.getElementById('cm-subject').value = prefillSubject || 'physics';
    document.getElementById('cm-name').value = '';
    document.getElementById('cm-total').value = adderPrefill ? adderPrefill.total : '';
    document.getElementById('cm-ongoing').checked = adderPrefill ? adderPrefill.ongoing : false;
    document.getElementById('save-chapter-btn').textContent = 'Add Chapter';
  }
  document.getElementById('chapter-modal').classList.remove('hidden');
}
function closeChapterModal() {
  document.getElementById('chapter-modal').classList.add('hidden');
  adderPrefill = null;
}
function saveChapterFromModal() {
  const errorEl = document.getElementById('chapter-modal-error');
  errorEl.classList.add('hidden');
  const subject = document.getElementById('cm-subject').value;
  const name = document.getElementById('cm-name').value.trim();
  const total = parseInt(document.getElementById('cm-total').value, 10);
  const isOngoing = document.getElementById('cm-ongoing').checked;

  if (!name) { errorEl.textContent = 'Chapter name is required.'; errorEl.classList.remove('hidden'); return; }
  if (!Number.isFinite(total) || total < 1 || total > 200) { errorEl.textContent = 'Enter a valid lecture count (1–200).'; errorEl.classList.remove('hidden'); return; }

  if (chapterModalMode === 'add') {
    state.chapters.unshift(mkChapter(subject, name, total, [], isOngoing));
    saveState();
    closeChapterModal();
    render();
    showToast('Chapter added');
  } else {
    const ch = state.chapters.find(c => c.id === chapterModalEditId);
    if (!ch) { closeChapterModal(); return; }
    ch.subject = subject;
    ch.name = name;
    const before = ch.clearedLectures.length;
    ch.clearedLectures = ch.clearedLectures.filter(n => n <= total);
    ch.totalLectures = total;
    ch.isOngoing = isOngoing;
    saveState();
    closeChapterModal();
    render();
    showToast(before !== ch.clearedLectures.length ? 'Chapter updated (some cleared lectures beyond new total were removed)' : 'Chapter updated');
  }
}

});

document.addEventListener('click', (e) => {
  const target = e.target;

  if (target.id === 'watch-submit-btn') {
    const subjSel = document.getElementById('watch-subject');
    const chapSel = document.getElementById('watch-chapter');
    const lecSel = document.getElementById('watch-lecture');
    if (chapSel && chapSel.value && lecSel && lecSel.value) {
      clearLecture(chapSel.value, parseInt(lecSel.value, 10), { log: true, confettiBurst: true });
      const ch = state.chapters.find(c => c.id === chapSel.value);
      showToast(`🔥 Logged L${lecSel.value} · ${ch ? ch.name : ''}`);
    }
    return;
  }
  if (target.id === 'adder-plus1-btn' || target.id === 'adder-plus2-btn') {
    const count = target.id === 'adder-plus1-btn' ? 1 : 2;
    const sel = document.getElementById('adder-chapter');
    if (sel.value === '__new__') {
      adderPrefill = { total: count, ongoing: true };
      openChapterModal({ mode: 'add' });
    } else {
      addLecturesToChapter(sel.value, count);
    }
    return;
  }
  if (target.id === 'adder-holiday-btn') { logHolidayToday(); return; }

  const btn = target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  switch (action) {
    case 'set-scenario':
      state.settings.scenario = btn.dataset.scenario;
      saveState(); render();
      break;
    case 'set-filter':
      state.ui.filter = btn.dataset.filter;
      saveState(); renderChapters(); lucide.createIcons();
      break;
    case 'toggle-pill':
      toggleLecturePill(btn.dataset.chapter, parseInt(btn.dataset.lecture, 10));
      break;
    case 'clear-next':
      clearNextForChapter(btn.dataset.chapter);
      break;
    case 'add-one-lecture':
      addLecturesToChapter(btn.dataset.chapter, 1);
      break;
    case 'edit-chapter':
      openChapterModal({ mode: 'edit', chapterId: btn.dataset.chapter });
      break;
    case 'delete-chapter':
      deleteChapter(btn.dataset.chapter);
      break;
    case 'add-chapter-for-subject':
      openChapterModal({ mode: 'add', prefillSubject: btn.dataset.subject });
      break;
    case 'undo-log':
      unclearLecture(btn.dataset.chapter, parseInt(btn.dataset.lecture, 10));
      break;
    case 'close-chapter-modal':
      closeChapterModal();
      break;
    case 'save-chapter':
      saveChapterFromModal();
      break;
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'watch-subject') { populateWatchChapterOptions(); populateWatchLectureOptions(); }
  if (e.target.id === 'watch-chapter') { populateWatchLectureOptions(); }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'weekday-pace-slider') {
    state.settings.weekdayPace = parseInt(e.target.value, 10);
    saveState(); renderLiveSyncHero(); renderPlanner(); lucide.createIcons();
  }
  if (e.target.id === 'sunday-pace-slider') {
    state.settings.sundayPace = parseInt(e.target.value, 10);
    saveState(); renderLiveSyncHero(); renderPlanner(); lucide.createIcons();
  }
  if (e.target.id === 'holidays-input') {
    const v = parseInt(e.target.value, 10);
    state.settings.holidaysUpcoming = Number.isFinite(v) && v >= 0 ? v : 0;
    saveState(); renderLiveSyncHero(); renderPlanner(); lucide.createIcons();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeChapterModal();
});

/* =========================================================
   Init
========================================================= */
render();
</script>
</body>
</html>
